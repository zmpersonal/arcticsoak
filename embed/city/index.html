<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ArcticSoak City Cost Card</title><meta name="description" content="Embeddable ArcticSoak city cold plunge cost card."><link rel="canonical" href="https://arcticsoak.com/embed/city/"><style>body{margin:0;background:#eefaff;color:#071d2b;font-family:Inter,system-ui,sans-serif}.card{border:1px solid #b8dce9;background:#fff;padding:20px;min-height:218px}.top{display:flex;justify-content:space-between;gap:12px;align-items:start}.brand{font-weight:950;letter-spacing:-.04em}.brand span{color:#006f9e}.status{font-size:10px;text-transform:uppercase;background:#fff3dd;border:1px solid #e9b65b;padding:4px 6px}.status.verified{background:#e3f8ed;border-color:#78cda1}h1{font-size:22px;margin:25px 0 6px}.range{font-size:33px;font-weight:950;letter-spacing:-.05em}.details{color:#526c79;font-size:13px;margin:5px 0 16px}a{color:#006f9e;font-weight:800;font-size:13px}</style></head><body><main class="card"><div class="top"><div class="brand">ARCTIC<span>SOAK</span></div><span id="status" class="status">Loading</span></div><h1 id="city">Cold plunge cost</h1><div id="range" class="range">—</div><p id="details" class="details">Loading current ArcticSoak planning scenarios…</p><a id="source" href="https://arcticsoak.com/cities/">View data, sources &amp; methodology →</a></main><script>const slug=new URLSearchParams(location.search).get('city');fetch('/data/index.json').then(r=>r.json()).then(data=>{const c=data.cities.find(x=>x.slug===slug);if(!c)throw Error();city.textContent=`Cold plunge cost in ${c.city}, ${c.state}`;range.textContent=`$${Math.round(c.scenarios.efficient.annual_cost)}–$${Math.round(c.scenarios.high_load.annual_cost)}/yr`;details.textContent=`$${Math.round(c.annual_cost)}/yr reference · 100 gallons · 50°F · Model ${data.model_version}`;status.textContent=c.climate_status;status.className=`status ${c.climate_status}`;source.href=`https://arcticsoak.com/cities/${c.slug}/`}).catch(()=>{status.textContent='Unavailable';details.textContent='Open ArcticSoak for the current city dataset.'})</script></body></html>
